<!-- public/favicon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Blue Background -->
  <rect width="64" height="64" fill="#2563eb"/>

  <!-- India Gate Icon (simplified) -->
  <g fill="white">
    <!-- Top -->
    <rect x="18" y="10" width="28" height="8" rx="2"/>
    
    <!-- Middle layers -->
    <rect x="14" y="20" width="36" height="4"/>
    <rect x="12" y="26" width="40" height="4"/>
    
    <!-- Main body -->
    <rect x="16" y="32" width="32" height="18"/>
    
    <!-- Arch cut -->
    <rect x="26" y="34" width="12" height="16" fill="#2563eb" rx="6"/>
  </g>
</svg>